name: Build, publish to PyPI, and create GitHub release

on:
  push:
    branches:
      - "release/v1.0.0"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build Python distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test and build package
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install .
          python -m compileall -q gdz.py test_gdz.py
          python -m unittest discover -s . -p "test_*.py" -v
          python -m build
          python -m twine check dist/*
      - name: Prepare source and script release assets
        run: |
          mkdir -p release-assets
          git archive --format=zip --prefix=gdz-parser/ HEAD > release-assets/gdz-parser-source.zip
          cp gdz.py release-assets/gdz.py
          cp test_gdz.py README.md pyproject.toml requirements.txt release-assets/
          cat > release-assets/run-gdz-parser.bat <<'BAT'
          @echo off
          chcp 65001 >nul
          cd /d "%~dp0"
          py -3 -m pip install -r "%~dp0requirements.txt"
          if errorlevel 1 python -m pip install -r "%~dp0requirements.txt"
          py -3 -m playwright install chromium
          if errorlevel 1 python -m playwright install chromium
          if exist "%~dp0gdz-parser.exe" (
            "%~dp0gdz-parser.exe" %*
          ) else (
            py -3 "%~dp0gdz.py" %*
            if errorlevel 1 python "%~dp0gdz.py" %*
          )
          BAT
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: release-source-assets
          path: release-assets/
          retention-days: 7

  windows-executable:
    name: Build Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build one-file executable
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install .
          pyinstaller --clean --onefile --collect-all playwright --name gdz-parser gdz.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: dist/gdz-parser.exe
          retention-days: 7

  publish:
    name: Publish to PyPI using Trusted Publishing
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gdz-parser/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release with source and executable
    needs: [build, windows-executable]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-source-assets
          path: release-assets/
      - uses: actions/download-artifact@v4
        with:
          name: windows-executable
          path: release-assets/
      - name: Create release and upload downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: GDZ Parser v1.0.0
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release-assets/*
