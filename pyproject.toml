[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gdz-parser"
version = "1.0.0"
description = "Search for open GDZ pages and create local previews of selected solutions."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "playwright>=1.51,<2",
]
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Topic :: Education",
  "Topic :: Utilities",
]

[project.scripts]
gdz-parser = "gdz:main"

[project.urls]
Homepage = "https://github.com/zmlsaggg/gdz-parser"
Repository = "https://github.com/zmlsaggg/gdz-parser"
Issues = "https://github.com/zmlsaggg/gdz-parser/issues"

[tool.setuptools]
py-modules = ["gdz"]
